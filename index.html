<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DropBridge</title>

<!-- Installable on a phone home screen; runs full-screen like an app.
     These all degrade quietly if the files aren't deployed alongside. -->
<meta name="theme-color" content="#0F1115">
<meta name="description" content="A private shared space for text, code, docs, images and audio across your devices.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DropBridge">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<style>
:root{
  --bg:#0F1115; --panel:#171A21; --panel-2:#1D212B; --border:#2A2F3A; --border-soft:#232733;
  --text:#EDEEF2; --muted:#8A90A0; --muted-2:#5D6373;
  --accent:#6EA8FE; --accent-ink:#0B0D14; --accent-soft:rgba(110,168,254,.12);
  --danger:#E0654D; --danger-soft:rgba(224,101,77,.12);
  --success:#3FBF7F; --success-soft:rgba(63,191,127,.12);
  --radius:14px; --radius-sm:9px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --shadow:0 8px 24px -12px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
/* Behave like an app, not a web page: no pinch or double-tap zoom, and no
   tap delay. The viewport meta blocks pinch; this kills double-tap. */
html,body{margin:0;height:100%;-webkit-text-size-adjust:100%;touch-action:manipulation}
body{background:
    radial-gradient(1200px 600px at 15% -10%, rgba(110,168,254,.05), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(110,168,254,.04), transparent 55%),
    var(--bg);
  color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit;font-size:14px}
button{cursor:pointer;border:none;border-radius:var(--radius-sm);transition:background .12s,border-color .12s,color .12s,transform .06s}
button:active{transform:translateY(1px)}
a{color:var(--accent)}
svg{display:block}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ---- brand ---- */
.brand{display:flex;align-items:center;gap:9px;font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);flex:none}
.brand-badge{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border:1px solid rgba(110,168,254,.3);padding:2px 7px;border-radius:20px;margin-left:2px}

/* ---- auth / config screens ---- */
.center{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:380px;max-width:100%;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:32px 30px;box-shadow:var(--shadow)}
.tagline{color:var(--muted);margin:6px 0 24px;font-size:14px}
.feature-list{list-style:none;padding:0;margin:0 0 22px;display:flex;flex-direction:column;gap:9px}
.feature-list li{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted)}
.feature-list svg{color:var(--accent);flex:none}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:500}
input,textarea,select{width:100%;padding:11px 13px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.primary{width:100%;padding:12px;background:var(--accent);color:var(--accent-ink);font-weight:600;margin-top:18px;border-radius:var(--radius-sm)}
.primary:hover{background:#8FBBFF}
.primary:disabled{opacity:.55;cursor:default}
.link-btn{background:none;color:var(--muted);padding:9px 0;margin-top:6px;width:100%;text-align:center;font-size:13px}
.link-btn:hover{color:var(--text)}
.msg{font-size:13px;margin-top:12px;padding:9px 11px;border-radius:var(--radius-sm);display:flex;gap:7px;align-items:flex-start}
.msg svg{flex:none;margin-top:1px}
.msg.err{background:var(--danger-soft);color:var(--danger)}
.msg.ok{background:var(--accent-soft);color:var(--accent)}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted-2);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin:20px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}

/* ---- config screen ---- */
.config-warn{background:var(--panel-2);border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:14px 15px;margin:18px 0;font-size:13px;color:var(--muted)}
.config-warn code{background:var(--bg);padding:2px 6px;border-radius:4px;color:var(--text);font-family:var(--mono);font-size:12px}
.demo-btn{width:100%;padding:12px;background:linear-gradient(135deg,#6EA8FE,#8B7CFA);color:#0B0D14;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.demo-btn:hover{filter:brightness(1.08)}

/* ---- app shell ---- */
.shell{max-width:1080px;margin:0 auto;padding:22px 20px 70px}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:14px;margin:-22px -20px 20px;padding:16px 20px;background:rgba(15,17,21,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--border-soft);flex-wrap:wrap}
.topbar-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.searchbox{position:relative;width:280px;max-width:44vw}
.searchbox svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted-2);pointer-events:none}
.searchbox input{padding-left:34px;padding-right:30px;background:var(--panel-2)}
.searchbox .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;color:var(--muted);padding:4px;border-radius:6px}
.searchbox .clear:hover{color:var(--text);background:var(--border)}
.topbar-right{display:flex;align-items:center;gap:10px}
.who{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px;min-width:0}
.who-email{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#0B0D14;flex:none}
.icon-btn{background:var(--panel-2);border:1px solid var(--border);color:var(--muted);width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm)}
.icon-btn:hover{border-color:var(--accent);color:var(--text)}
.icon-btn.spinning svg{animation:spin .7s linear infinite}
.icon-btn.spinning{color:var(--accent);border-color:var(--accent)}
.ghost{background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:8px 13px;display:flex;align-items:center;gap:7px;font-size:13px}
.ghost:hover{border-color:var(--accent)}

.demo-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(135deg,rgba(110,168,254,.1),rgba(139,124,250,.08));border:1px solid rgba(110,168,254,.25);border-radius:var(--radius-sm);padding:11px 15px;margin-bottom:18px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.demo-banner b{color:var(--text)}
.demo-banner .actions{display:flex;gap:8px}
.mini-link{background:none;color:var(--accent);font-size:12.5px;padding:5px 8px}
.mini-link:hover{text-decoration:underline}

.composer{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:22px;box-shadow:var(--shadow)}
.composer textarea{resize:vertical;min-height:92px;max-height:460px;font-family:inherit;line-height:1.55;overflow-y:auto}
.composer textarea.code-mode{font-family:var(--mono);font-size:13px}
.composer-row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;align-items:center}
.segmented{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:3px;gap:2px}
.segmented button{background:none;color:var(--muted);padding:6px 13px;font-size:13px;border-radius:7px}
.segmented button.active{background:var(--panel-2);color:var(--text)}
.composer-row .primary{width:auto;margin-top:0;padding:9px 18px;display:flex;align-items:center;gap:7px}
.hint{color:var(--muted-2);font-size:12px;margin-left:auto}
.folder-row{margin-top:10px}
.folder-field{display:inline-flex;align-items:center;gap:7px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 11px;color:var(--muted-2);width:260px;max-width:100%}
.folder-field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.folder-field input{border:none;background:none;padding:0;width:100%}
.folder-field input:focus{outline:none;box-shadow:none}
.dropzone{margin-top:12px;padding:20px 16px;text-align:center;border:1.5px dashed var(--border);border-radius:var(--radius-sm);color:var(--muted);font-size:13px;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:8px}
.dropzone svg{color:var(--muted-2)}
.dropzone.drag{border-color:var(--accent);background:var(--accent-soft)}
.dropzone.drag svg{color:var(--accent)}
.file-btn{display:inline-block;padding:8px 16px;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);font-size:13px}
.file-btn:hover{border-color:var(--accent)}
.status{font-size:12px;color:var(--accent);min-height:16px;margin-top:2px}

/* ---- tabs ---- */
.tabs-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;max-width:100%}
.tabs-scroll{flex:1;min-width:0;overflow-x:auto;overflow-y:visible;padding-top:20px;margin-top:-20px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs-scroll::-webkit-scrollbar{display:none}
.tabs{position:relative;display:flex;gap:2px;padding:4px;background:#1A2440;border:1px solid #2A3A63;border-radius:22px;width:max-content}
.tabs-defs{position:absolute;width:0;height:0;overflow:hidden}
.tab-indicator{position:absolute;top:4px;left:0;background:#33477A;clip-path:url(#tab-blob);transition:transform .5s cubic-bezier(.34,1.56,.64,1),width .5s cubic-bezier(.34,1.56,.64,1),height .5s cubic-bezier(.34,1.56,.64,1);pointer-events:none;z-index:0}
.tab{position:relative;z-index:1;white-space:nowrap;padding:7px 14px 7px 7px;background:none;border:1px solid transparent;border-radius:20px;color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px;transition:color .2s ease}
.tab:hover{color:var(--text)}
.tab.active{color:var(--tab-accent,var(--text));font-weight:600}
.tab-icon{display:flex;align-items:center;justify-content:center;flex:none;width:30px;height:30px;border-radius:50%;transition:background-color .35s cubic-bezier(.34,1.56,.64,1),transform .35s cubic-bezier(.34,1.56,.64,1),box-shadow .35s ease}
.tab.active .tab-icon{background:var(--tab-accent);color:#0B0D14;transform:translateY(-13px);box-shadow:0 6px 14px -2px rgba(0,0,0,.5)}
.tab-icon path,.tab-icon circle,.tab-icon rect{stroke-dasharray:400;stroke-dashoffset:0}
.tab.active .tab-icon path,.tab.active .tab-icon circle,.tab.active .tab-icon rect{animation:strok .6s ease-out reverse}
@keyframes strok{
  100%{stroke-dashoffset:400}
}
.tab .count{opacity:.45;font-size:12px;transition:opacity .2s ease,color .2s ease}
.tab .count.has{opacity:1;font-weight:700;color:var(--tab-accent)}
.tab.active .count.has{color:inherit;opacity:.85}
.result-count{color:var(--muted-2);font-size:12.5px;white-space:nowrap}

/* ---- folder stacks ---- */
.folder-group{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:border-color .15s}
.folder-group.open{border-color:#3A4150}
.folder-head{width:100%;display:flex;align-items:center;gap:12px;padding:12px 15px;background:none;color:var(--text);text-align:left;border-radius:0}
.folder-head:hover{background:var(--panel-2)}
.folder-visual{position:relative;width:40px;height:32px;flex:none}
.folder-page{position:absolute;top:-2px;width:20px;height:24px;border-radius:5px;background:linear-gradient(to bottom,#E8E7F0,#DCDAE8);box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.folder-page-a{left:1px;transform:rotate(-6deg)}
.folder-page-b{left:9px;transform:rotate(0deg)}
.folder-page-c{left:17px;transform:rotate(6deg)}
.folder-group.open .folder-page-a{transform:rotate(-14deg) translate(-8px,-11px)}
.folder-group.open .folder-page-b{transform:rotate(1deg) translate(0,-15px)}
.folder-group.open .folder-page-c{transform:rotate(14deg) translate(8px,-11px)}
.folder-shell{position:absolute;bottom:0;left:0;width:40px;height:21px;border-radius:7px;background:#18151B;box-shadow:0 0 10px 8px rgba(79,73,85,.28) inset;z-index:1;transition:transform .45s ease;transform-origin:bottom;perspective:200px}
.folder-group.open .folder-shell{transform:rotateX(-32deg)}
.folder-name{flex:1;font-size:13.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folder-head .count{opacity:.6;font-size:12px}
.folder-chevron{color:var(--muted-2);transition:transform .2s ease;display:flex;flex:none}
.folder-group.open .folder-chevron{transform:rotate(90deg)}
.folder-body{display:flex;flex-direction:column;gap:10px;padding:2px 15px 15px;border-top:1px solid var(--border-soft);margin-top:2px;padding-top:12px}

/* ---- items ---- */
.items{display:flex;flex-direction:column;gap:10px}
.item{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:15px 17px;display:flex;gap:13px;transition:border-color .12s}
.item:hover{border-color:var(--border-soft);border-color:#3A4150}
.item-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.item-body{min-width:0;flex:1}
.item-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.item-title{font-weight:600;margin:0;word-break:break-all;font-size:14.5px}
.item-title mark{background:var(--accent);color:var(--accent-ink);border-radius:3px;padding:0 1px}
.badge-mine{font-size:10.5px;color:var(--accent);border:1px solid rgba(110,168,254,.3);background:var(--accent-soft);padding:1px 6px;border-radius:10px;flex:none}
.item-text{white-space:pre-wrap;word-break:break-word;margin:8px 0 0;font-size:13.5px;color:var(--text);line-height:1.6}
.item-text mark{background:var(--accent);color:var(--accent-ink);border-radius:2px}
.item-text.code{font-family:var(--mono);font-size:12.5px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:11px 12px;overflow-x:auto;line-height:1.55}
.item-text.clamped{max-height:9.6em;overflow:hidden;position:relative}
.item-text.code.clamped{max-height:10.5em}
.item-text.clamped::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3em;background:linear-gradient(transparent,var(--panel));pointer-events:none}
.item-text.code.clamped::after{background:linear-gradient(transparent,var(--bg));border-radius:0 0 8px 8px}
.expand-btn{background:none;color:var(--accent);font-size:12.5px;font-weight:600;padding:6px 0 0;display:flex;align-items:center;gap:5px}
.expand-btn:hover{text-decoration:underline}
.expand-btn svg{transition:transform .2s ease}
.expand-btn.open svg{transform:rotate(180deg)}
.thumb{max-width:100%;max-height:280px;border-radius:8px;margin:10px 0 0;display:block;border:1px solid var(--border)}
.item-meta{color:var(--muted-2);font-size:12px;margin:8px 0 0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item-meta .sep{opacity:.5}
.item-meta .owner{color:var(--muted);font-weight:500}
.item-actions{display:flex;gap:14px;margin-top:10px}
.item-actions button{background:none;color:var(--muted);padding:0;display:flex;align-items:center;gap:5px;font-size:12.5px}
.item-actions button:hover{color:var(--accent)}
.item-actions .del:hover{color:var(--danger)}
.demo-limit{color:var(--muted-2);font-size:12px;font-style:italic;margin-top:8px}

/* ---- sharing: scope filter, tagging, visibility ---- */
.scope-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.scope{display:flex;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-sm);padding:3px;gap:2px}
.scope button{background:none;color:var(--muted);padding:6px 13px;font-size:13px;border-radius:7px;display:flex;align-items:center;gap:6px}
.scope button:hover{color:var(--text)}
.scope svg{width:14px;height:14px;flex:none}
.scope button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.scope .pill{background:var(--accent);color:var(--accent-ink);font-size:10.5px;font-weight:700;border-radius:9px;padding:0 5px;min-width:16px;text-align:center}

.share-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.vis{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:3px;gap:2px}
.vis button{background:none;color:var(--muted);padding:6px 11px;font-size:12.5px;border-radius:7px;display:flex;align-items:center;gap:6px}
.vis button.active{background:var(--panel-2);color:var(--text);font-weight:600}
.vis button.active.tagged{color:var(--accent)}
.vis svg{width:13px;height:13px}

.tag-field{position:relative;flex:1;min-width:200px}
.tag-box{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 9px;min-height:38px}
.tag-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tag-box input{border:none;background:none;padding:0;flex:1;min-width:90px;color:var(--text)}
.tag-box input:focus{outline:none;box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--accent-soft);color:var(--accent);border:1px solid rgba(110,168,254,.3);border-radius:20px;padding:2px 5px 2px 9px;font-size:12px;font-weight:600}
.chip button{background:none;color:inherit;padding:0 2px;display:flex;opacity:.7}
.chip button:hover{opacity:1}
.suggest{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 4px);background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow);overflow:hidden;max-height:210px;overflow-y:auto}
.suggest button{width:100%;display:flex;align-items:center;gap:9px;background:none;color:var(--text);padding:9px 12px;font-size:13px;text-align:left;border-radius:0}
.suggest button:hover,.suggest button.sel{background:var(--accent-soft)}
.suggest .mail{color:var(--muted-2);font-size:11.5px;margin-left:auto}
.suggest .none{color:var(--muted-2);padding:10px 12px;font-size:12.5px}

.item-share{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:9px;font-size:11.5px}
.vis-badge{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:2px 8px;font-weight:600;letter-spacing:.02em}
.vis-badge svg{width:11px;height:11px}
.vis-badge.tagged{color:var(--accent);background:var(--accent-soft);border:1px solid rgba(110,168,254,.3)}
.vis-badge.private{color:var(--muted);background:rgba(138,144,160,.12);border:1px solid rgba(138,144,160,.3)}
.tag-list{color:var(--muted);display:inline-flex;gap:5px;flex-wrap:wrap}
.tag-list b{color:var(--accent);font-weight:600}

/* ---- first sign-in: choose a handle ---- */
.username-hint{color:var(--muted-2);font-size:12.5px;margin:6px 0 0}
.at-field{display:flex;align-items:center;gap:2px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:0 12px}
.at-field span{color:var(--muted-2);font-size:15px}
.at-field input{border:none;background:none;padding:11px 2px}
.at-field input:focus{outline:none;box-shadow:none}
.at-field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* ---- voice-note transcripts ---- */
.transcript{margin-top:10px;background:var(--bg);border:1px solid var(--border);border-left:2px solid var(--accent);border-radius:8px;padding:11px 13px}
.transcript-label{display:flex;align-items:center;gap:6px;color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-bottom:7px}
.transcript-label svg{width:13px;height:13px}
.transcript-text{white-space:pre-wrap;word-break:break-word;font-size:13.5px;line-height:1.6;color:var(--text);margin:0}
.transcript-text mark{background:var(--accent);color:var(--accent-ink);border-radius:2px}
.transcript.clamped .transcript-text{max-height:8.6em;overflow:hidden;position:relative}
.transcribing{display:flex;align-items:center;gap:8px;color:var(--accent);font-size:12.5px;margin-top:9px}
.spinner{width:13px;height:13px;border:2px solid var(--accent-soft);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.transcribe-err{color:var(--danger);font-size:12.5px;margin-top:9px}

/* ---- paging: keep the home list short ---- */
.more-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding:13px 16px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);flex-wrap:wrap}
.more-bar .shown{color:var(--muted-2);font-size:12.5px}
.more-bar .btns{display:flex;gap:8px;flex-wrap:wrap}
.more-bar button{background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:8px 14px;font-size:13px;display:flex;align-items:center;gap:7px}
.more-bar button:hover{border-color:var(--accent);color:var(--accent)}
.more-bar button.primary-more{background:var(--accent-soft);border-color:rgba(110,168,254,.35);color:var(--accent);font-weight:600}
.more-bar svg{width:14px;height:14px}

.empty{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted);padding:56px 20px;text-align:center}
.empty svg{color:var(--muted-2)}
.empty b{color:var(--text)}
.hidden{display:none!important}

/* ---- small screens ---- */
@media (max-width:860px){
  .shell{padding:18px 14px calc(60px + env(safe-area-inset-bottom))}
  .topbar{margin:-18px -14px 16px;padding:12px 14px;gap:10px;
    padding-top:calc(12px + env(safe-area-inset-top))}
  .hint{display:none}                      /* keyboard shortcut is desktop-only anyway */
  .composer{padding:13px}
}
@media (max-width:640px){
  .searchbox{width:100%;max-width:none;order:3}
  .topbar-left{width:100%;gap:10px}

  .who{min-width:0}
  .who-email{max-width:46vw}
  .item{flex-direction:column;padding:13px 14px}
  .item-actions{flex-wrap:wrap;gap:12px}
  .item-head{flex-wrap:wrap}
  .folder-body{padding-left:10px;padding-right:10px}
  .folder-head{padding:11px 12px;gap:10px}
  .demo-banner{padding:10px 12px}
  .composer-row{gap:8px}
  .composer-row .primary{flex:1;justify-content:center}
  .folder-field{width:100%}
  /* iOS zooms the whole page when you focus an input under 16px */
  input,textarea,select{font-size:16px}
}
@media (max-width:400px){

function humanSize(n){if(n==null)return"";const u=["B","KB","MB","GB"];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++;}return (i===0?n:n.toFixed(1))+" "+u[i];}
function timeAgo(ts){const d=(Date.now()-new Date(ts).getTime())/1000;if(d<5)return"just now";if(d<60)return Math.floor(d)+"s ago";if(d<3600)return Math.floor(d/60)+"m ago";if(d<86400)return Math.floor(d/3600)+"h ago";if(d<604800)return Math.floor(d/86400)+"d ago";return new Date(ts).toLocaleDateString();}

function highlight(text, q){
  if(!q) return esc(text);
  const s = esc(text); const qi = esc(q);
  const idx = s.toLowerCase().indexOf(qi.toLowerCase());
  if(idx===-1) return s;
  return s.slice(0,idx)+"<mark>"+s.slice(idx,idx+qi.length)+"</mark>"+s.slice(idx+qi.length);
}

function classify(file){
  const mime = file.type || "";
  const ext = (file.name.split(".").pop() || "").toLowerCase();
  if (mime.startsWith("image/")) return "image";
  if (mime.startsWith("audio/")) return "audio";
  if (CODE_EXT.includes(ext)) return "code";

}

const DemoBackend = (()=>{
  const LS_ITEMS = "dropbridge_demo_items_v1";
  const LS_USER  = "dropbridge_demo_user_v1";
  const MAX_DEMO_FILE = 4 * 1024 * 1024; // 4MB — keep localStorage happy
  let listeners = {insert:[], delete:[]};

  function load(){ try{ return JSON.parse(localStorage.getItem(LS_ITEMS)||"[]"); }catch{ return []; } }

  function seedIfEmpty(){
    if(localStorage.getItem(LS_ITEMS) !== null) return;

      {id:crypto.randomUUID(), owner:"demo", owner_email:"jordan@demo.local", kind:"audio", title:"voice-memo.m4a", size:890000, mime:"audio/m4a", created_at:new Date(now-1000*60*60*72).toISOString(), demoNoContent:true},
    ];
    save(seed);
  }
  function currentUser(){
    let u = null;
    try{ u = JSON.parse(localStorage.getItem(LS_USER)||"null"); }catch{}
    return u || {id:"demo", email:"you@demo.local"};
  }
  // Stand-ins so tagging can be tried out without a real project.
  const DEMO_PROFILES = [
    {user_id:"demo",    username:"you",    email:"you@demo.local",    username_set:true},
    {user_id:"jordan",  username:"jordan", email:"jordan@demo.local", username_set:true},
    {user_id:"sam",     username:"sam",    email:"sam@demo.local",    username_set:true},
  ];

  return {
    async getSession(){ seedIfEmpty(); return {user: currentUser()}; },
    onAuthChange(){ /* single local user, nothing to watch */ },
    async signOut(){ /* no-op in demo */ },
    async listItems(){ return load().sort((a,b)=> new Date(b.created_at)-new Date(a.created_at)); },
    async insertItem({owner,owner_email,kind,title,content,folder,visibility,tagged}){
      const list = load();
      const it = {id:crypto.randomUUID(), owner, owner_email, kind, title, content, folder:folder||null,
                  visibility:visibility||"everyone", tagged:tagged||[], created_at:new Date().toISOString()};
      list.unshift(it); save(list);
      listeners.insert.forEach(cb=>cb(it));
      return it;
    },
    async insertFile({owner,owner_email,kind,file,folder,visibility,tagged}){
      const list = load();
      const it = {id:crypto.randomUUID(), owner, owner_email, kind, title:file.name, size:file.size, mime:file.type, folder:folder||null,
                  visibility:visibility||"everyone", tagged:tagged||[], created_at:new Date().toISOString()};

        it.dataUrl = await new Promise((res)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(file); });
      } else {
        it.demoNoContent = true;
      }
      list.unshift(it); save(list);
      listeners.insert.forEach(cb=>cb(it));
      return it;
    },
    async deleteItem(it){
      const list = load().filter(x=>x.id!==it.id);
      save(list);
      listeners.delete.forEach(cb=>cb(it));
    },
    async updateItem(id, patch){
      const list = load();
      const it = list.find(x=>x.id===id);
      if(it) Object.assign(it, patch);

    async transcribe(){
      throw new Error("Transcription needs a real Supabase project — it isn't available in Demo Mode.");
    },
    async fileUrl(it){ return it.dataUrl || null; },
    startRealtime(onInsert,onDelete){ listeners.insert.push(onInsert); listeners.delete.push(onDelete); },
    stopRealtime(){ listeners = {insert:[], delete:[]}; },
    resetDemo(){ localStorage.removeItem(LS_ITEMS); localStorage.removeItem(LS_USER); location.reload(); },
  };
})();

    if(error) throw error;
  },
  async updateItem(id, patch){ const {error} = await sb.from("items").update(patch).eq("id", id); if(error) throw error; },
  // Goes through an RPC so anyone who can see a voice note can caption it,
  // without being able to edit the rest of the row.
  async setTranscript(id, text){ const {error} = await sb.rpc("set_transcript", {item_id:id, text_in:text}); if(error) throw error; },
  async listProfiles(){ const {data,error} = await sb.from("profiles").select("*").order("username"); if(error) throw error; return data||[]; },
  async myProfile(){
    const {data:{user}} = await sb.auth.getUser();
    if(!user) return null;
    const {data} = await sb.from("profiles").select("*").eq("user_id", user.id).maybeSingle();
    return data || null;
  },
  async setUsername(name){
    const {data:{user}} = await sb.auth.getUser();
    const {error} = await sb.from("profiles").update({username:name, username_set:true}).eq("user_id", user.id);
    if(error) throw error;
  },
  async transcribe(payload){
    const {data,error} = await sb.functions.invoke("transcribe", {body: payload});
    if(error){
      // The function returns a JSON body explaining what went wrong; surface that.
      let detail = error.message || "Transcription failed.";
      try{ const b = await error.context?.json(); if(b?.error) detail = b.error; }catch{}
      throw new Error(detail);
    }
    if(data?.error) throw new Error(data.error);
    return data?.text || "";
  },
  async insertFile({owner,owner_email,kind,file,folder,visibility,tagged}){
    const path = owner + "/" + Date.now() + "_" + file.name.replace(/[^\w.\-]+/g,"_");
    const {error:upErr} = await sb.storage.from("shared").upload(path, file, {upsert:false});
    if(upErr) throw upErr;
    const {data,error} = await sb.from("items").insert({owner,owner_email,kind,title:file.name,storage_path:path,size:file.size,mime:file.type,folder:folder||null,
      visibility:visibility||"everyone", tagged:tagged||[]}).select().single();
    if(error) throw error;
    return data;
  },
  async deleteItem(it){
    if(it.storage_path){ await sb.storage.from("shared").remove([it.storage_path]); }
    await sb.from("items").delete().eq("id", it.id);
  },
  async fileUrl(it, download){
    if(!it.storage_path) return null;
    const {data,error} = await sb.storage.from("shared").createSignedUrl(it.storage_path, 3600, download?{download:true}:{});
    if(error) return null;
    return data.signedUrl;
  },
  startRealtime(onInsert,onDelete){
    this._channel = sb.channel("items-live")
      .on("postgres_changes", {event:"INSERT", schema:"public", table:"items"}, (p)=>onInsert(p.new))
      .on("postgres_changes", {event:"DELETE", schema:"public", table:"items"}, (p)=>onDelete(p.old))
      .subscribe();
  },
  stopRealtime(){ if(this._channel){ sb.removeChannel(this._channel); this._channel=null; } },
} : null;

const Backend = DEMO ? DemoBackend : SupaBackend;

// ---------- rendering ----------
function render(){
  if (!session){ renderAuth(); return; }
  // First time in, people choose the handle others will tag them by.
  if (me && !me.username_set){ renderUsernamePicker(); return; }
  renderApp();
}

function renderUsernamePicker(){
  root.innerHTML = "";
  const suggested = me?.username || "";
  const wrap = h(`<div class="center"><div class="card">
    <h1 class="brand"><span class="dot"></span>DropBridge</h1>
    <p class="tagline">Pick the handle your team will tag you by.</p>
    <label>Your username</label>
    <div class="at-field"><span>@</span><input id="uname" autocomplete="off" spellcheck="false" maxlength="20" value="${esc(suggested)}"></div>
    <p class="username-hint">Letters, numbers and underscores. You can change it later.</p>
    <button class="primary" id="save-uname">Continue</button>
    <div id="uname-msg"></div>
  </div></div>`);
  root.appendChild(wrap);

  const input = wrap.querySelector("#uname");
  const btn = wrap.querySelector("#save-uname");
  const msg = wrap.querySelector("#uname-msg");
  input.focus();
  input.select();

  const fail = (t)=>{ msg.innerHTML=""; msg.appendChild(h(`<div class="msg err">${ICON.alert}<span>${esc(t)}</span></div>`)); };

  btn.onclick = async ()=>{
    const name = input.value.trim().toLowerCase();
    if(!/^[a-z0-9_]{2,20}$/.test(name)){
      return fail("2–20 characters, using letters, numbers or underscores.");
    }
    const taken = profiles.some(p=>p.username===name && p.user_id!==me.user_id);
    if(taken) return fail("That handle is already taken.");
    btn.disabled = true;
    try{
      await Backend.setUsername(name);
      me = await Backend.myProfile();
      profiles = await Backend.listProfiles();
      render();
    }catch(e){
      btn.disabled = false;
      fail(e.message || "Couldn't save that username.");
    }
  };
  input.addEventListener("keydown", e=>{ if(e.key==="Enter") btn.click(); });
}

function renderAuth(){
  root.innerHTML = "";
  let mode = "signin"; // signin | signup
  const wrap = h(`<div class="center"><div class="card">
    <h1 class="brand"><span class="dot"></span>DropBridge</h1>
    <p class="tagline">Your files and text, in sync across every device.</p>
    <ul class="feature-list">
      <li>${ICON.check} Phone, Mac and Windows — one shared space</li>
      <li>${ICON.check} Instant sync the moment something's sent</li>
      <li>${ICON.check} Search everything by name or contents</li>
    </ul>
    <div id="form"></div>
  </div></div>`);
  root.appendChild(wrap);
  const formHost = wrap.querySelector("#form");

  function paint(){
    formHost.innerHTML = "";
    const isSignup = mode === "signup";
    const form = h(`<div>
      <label>Email</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com">
      <label>Password</label>
      <input id="password" type="password" autocomplete="${isSignup?'new-password':'current-password'}" placeholder="${isSignup?'Choose a password':'Your password'}">
      <button class="primary" id="go">${isSignup?'Create account':'Sign in'}</button>
      <button class="link-btn" id="toggle">${isSignup?'Already invited? Sign in':'First time? Create your account'}</button>
      <div id="m"></div>
    </div>`);
    formHost.appendChild(form);
    const m = form.querySelector("#m");
    const show = (t,ok)=>{ m.innerHTML=""; m.appendChild(h(`<div class="msg ${ok?'ok':'err'}">${ok?ICON.check:ICON.alert}<span>${esc(t)}</span></div>`)); };

    form.querySelector("#toggle").onclick = ()=>{ mode = isSignup?"signin":"signup"; paint(); };
    form.querySelector("#go").onclick = async ()=>{
      const email = form.querySelector("#email").value.trim();
      const password = form.querySelector("#password").value;
      if(!email || !password){ show("Enter your email and password."); return; }
      show(isSignup?"Creating account…":"Signing in…", true);
      try{
        if(isSignup){
          const {error} = await Backend.signUp(email,password);
          if(error) throw error;
          show("Account created. If email confirmation is on, check your inbox, then sign in.", true);
          mode="signin";
        } else {
          const {error} = await Backend.signIn(email,password);
          if(error) throw error;
        }
      }catch(e){ show(e.message || "Something went wrong."); }
    };
    ["email","password"].forEach(id=>form.querySelector("#"+id).addEventListener("keydown",e=>{if(e.key==="Enter")form.querySelector("#go").click();}));
  }
  paint();
}

  root.appendChild(shell);

  };

  // search
  const searchEl = shell.querySelector("#search");
  const clearBtn = shell.querySelector("#clear-search");
  searchEl.value = searchQuery;
  clearBtn.classList.toggle("hidden", !searchQuery);
  searchEl.addEventListener("input", ()=>{

  clearBtn.onclick = ()=>{ searchQuery=""; searchEl.value=""; visibleCount = PAGE_SIZE; clearBtn.classList.add("hidden"); searchEl.focus(); paintItems(); };

  // ---------- who is this for? ----------
  let visibility = "everyone";
  let tagged = [];                       // user_ids
  const visWrap  = shell.querySelector("#vis-pick");
  const tagField = shell.querySelector("#tag-field");
  const tagBox   = shell.querySelector("#tag-box");
  const tagInput = shell.querySelector("#tag-input");
  let suggestBox = null, selIdx = 0;

  function paintChips(){
    tagBox.querySelectorAll(".chip").forEach(c=>c.remove());
    tagged.forEach(id=>{
      const chip = h(`<span class="chip">@${esc(profileFor(id)?.username || "someone")}<button title="Remove">${ICON.close}</button></span>`);
      chip.querySelector("button").onclick = ()=>{ tagged = tagged.filter(x=>x!==id); paintChips(); };
      tagBox.insertBefore(chip, tagInput);
    });
  }

  function closeSuggest(){ if(suggestBox){ suggestBox.remove(); suggestBox = null; } selIdx = 0; }

  function candidates(){
    const q = tagInput.value.trim().toLowerCase().replace(/^@/,"");
    return profiles
      .filter(p=> p.user_id !== me?.user_id && !tagged.includes(p.user_id))
      .filter(p=> !q || p.username.toLowerCase().includes(q) || (p.email||"").toLowerCase().includes(q));
  }

  function openSuggest(){
    closeSuggest();
    const list = candidates();
    suggestBox = h(`<div class="suggest"></div>`);
    if(!list.length){
      suggestBox.appendChild(h(`<div class="none">${profiles.length<=1 ? "Nobody else has signed up yet." : "No match."}</div>`));
    } else {
      list.forEach((p,i)=>{
        const b = h(`<button class="${i===selIdx?'sel':''}">@${esc(p.username)}<span class="mail">${esc(p.email||"")}</span></button>`);
        b.onclick = ()=>addTag(p.user_id);
        suggestBox.appendChild(b);
      });
    }
    tagField.appendChild(suggestBox);
  }

  function addTag(id){
    if(!tagged.includes(id)) tagged.push(id);
    tagInput.value = "";
    paintChips();
    closeSuggest();
    tagInput.focus();
  }

  closeTagSuggest = closeSuggest;   // let the one document-level listener reach us
  tagInput.addEventListener("focus", openSuggest);
  tagInput.addEventListener("input", ()=>{ selIdx = 0; openSuggest(); });
  tagInput.addEventListener("keydown", (e)=>{
    const list = candidates();
    if(e.key==="ArrowDown"){ e.preventDefault(); selIdx = Math.min(selIdx+1, list.length-1); openSuggest(); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); selIdx = Math.max(selIdx-1, 0); openSuggest(); }
    else if(e.key==="Enter" && list.length){ e.preventDefault(); addTag(list[selIdx].user_id); }
    else if(e.key==="Escape"){ closeSuggest(); }
    else if(e.key==="Backspace" && !tagInput.value && tagged.length){ tagged.pop(); paintChips(); }
  });
  function setVisibility(v){
    visibility = v;
    visWrap.querySelectorAll("button").forEach(x=>{
      const on = x.dataset.v === v;
      x.classList.toggle("active", on);
      x.classList.toggle("tagged", on && v==="tagged");
    });
    tagField.classList.toggle("hidden", v!=="tagged");
    if(v!=="tagged") closeSuggest();
  }

  visWrap.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    setVisibility(b.dataset.v);
    // Focus after this click finishes bubbling, or the document-level
    // "click outside" handler would immediately shut the suggestions again.
    if(visibility==="tagged") setTimeout(()=>tagInput.focus(), 0);
  });

  // Sharing choices are per-item: carrying them over risks quietly sending
  // the next thing to the wrong person.
  function resetShare(){
    tagged = [];
    paintChips();
    tagInput.value = "";
    setVisibility("everyone");
  }

  // ---------- scope filter ----------
  const scopeWrap = shell.querySelector("#scope-pick");
  scopeWrap.querySelectorAll("button").forEach(b=>{
    b.classList.toggle("active", b.dataset.s===scope);
    b.onclick = ()=>{
      scope = b.dataset.s;
      visibleCount = PAGE_SIZE;
      scopeWrap.querySelectorAll("button").forEach(x=>x.classList.toggle("active", x===b));
      paintTabs(); paintItems();

  });

  // Resolves the composer's sharing choice, or null if it's incomplete.
  function shareFor(){
    if(visibility === "tagged" && !tagged.length) return null;
    return { visibility, tagged: visibility === "tagged" ? tagged.slice() : [] };
  }

  // send text/code
  const noteEl = shell.querySelector("#note");
  const sendBtn = shell.querySelector("#send-note");

  function growNote(){
    noteEl.style.height = "auto";
    noteEl.style.height = Math.min(noteEl.scrollHeight, 460) + "px";

  // note kind segmented control
  let noteKind = "text";
  const kindWrap = shell.querySelector("#note-kind");
  kindWrap.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    noteKind = b.dataset.v;
    kindWrap.querySelectorAll("button").forEach(x=>x.classList.toggle("active", x===b));
    noteEl.classList.toggle("code-mode", noteKind==="code");
    growNote();
  });

  sendBtn.onclick = async ()=>{
    const content = noteEl.value.trim();
    if(!content) return;
    const folder = folderEl.value.trim() || null;
    const status = shell.querySelector("#status");
    const share = shareFor();
    if(!share){ status.textContent = "Tag at least one person, or switch to Everyone."; return; }
    sendBtn.disabled = true;
    try{
      // A bare YouTube link becomes its transcript rather than a naked URL.
      const vid = youtubeId(content);
      if(vid && !/\s/.test(content)){
        status.textContent = "Fetching YouTube transcript…";
        const text = await Backend.transcribe({youtube: content});
        const firstLine = text.split("\n").find(l=>l.trim()) || "";
        const title = firstLine.startsWith("#")
          ? firstLine.replace(/^#+\s*/,"").slice(0,80)
          : "YouTube transcript · " + vid;
        await Backend.insertItem({owner: session.user.id, owner_email: email, kind:"text", title, content: text, folder, ...share});
        status.textContent = "Transcript saved.";
        setTimeout(()=>status.textContent="", 2500);
      } else {
        const title = content.split("\n")[0].slice(0,60) + (content.length>60?"…":"");
        await Backend.insertItem({owner: session.user.id, owner_email: email, kind: noteKind, title, content, folder, ...share});
      }
      noteEl.value="";
      noteEl.style.height = "";
      resetShare();
      await loadItems();
    } catch(e){
      status.textContent = "Failed: " + (e.message || e);
    } finally { sendBtn.disabled = false; }
  };
  noteEl.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey))sendBtn.click();});

  // file upload
  const fileEl = shell.querySelector("#file");
  const dz = shell.querySelector("#dz");
  const status = shell.querySelector("#status");
  async function upload(file){
    if(!file) return;
    const share = shareFor();
    if(!share){ status.textContent = "Tag at least one person, or switch to Everyone."; return; }
    status.textContent = "Uploading "+file.name+"…";
    const kind = classify(file);
    const folder = folderEl.value.trim() || null;
    try{
      const created = await Backend.insertFile({owner: session.user.id, owner_email: email, kind, file, folder, ...share});
      status.textContent = "Sent.";
      resetShare();
      await loadItems();

      // Voice notes get turned into text automatically.
      if(kind==="audio" && created?.id && created?.storage_path){
        status.textContent = "Transcribing voice note…";
        try{
          const text = await Backend.transcribe({storage_path: created.storage_path});
          await Backend.setTranscript(created.id, text);
          const row = items.find(x=>x.id===created.id);
          if(row) row.transcript = text;
          paintItems();
          status.textContent = "Transcript ready.";
        }catch(e){
          status.textContent = "Sent, but transcription failed: " + (e.message||e);
          return;
        }
      }
      setTimeout(()=>status.textContent="",2500);
    }catch(e){ status.textContent = "Upload failed: "+(e.message||e); }
  }
  fileEl.onchange = ()=>{ if(fileEl.files[0]) upload(fileEl.files[0]); fileEl.value=""; };
  ["dragenter","dragover"].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add("drag");}));
  ["dragleave","drop"].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove("drag");}));
  dz.addEventListener("drop",e=>upload(e.dataTransfer.files[0]));

  paintTabs();
  paintItems();
}

function matchesSearch(it, q){
  if(!q) return true;
  q = q.toLowerCase();
  return (it.title||"").toLowerCase().includes(q) ||
         (it.content||"").toLowerCase().includes(q) ||
         (it.transcript||"").toLowerCase().includes(q) ||
         (it.owner_email||"").toLowerCase().includes(q) ||
         (it.folder||"").toLowerCase().includes(q);
}

const openFolders = new Set();

const myId = ()=> session?.user?.id;
function isForMe(it){ return (it.tagged||[]).includes(myId()) && it.owner !== myId(); }
function isJustMine(it){ return it.owner === myId() && it.visibility === "private"; }

// The Everything / For me / Just mine filter, applied before anything else.
function inScope(it){
  if(scope === "forme") return isForMe(it);
  if(scope === "mine")  return isJustMine(it);
  return true;
}

function paintTabs(){
  const tabsEl = document.getElementById("tabs");
  if(!tabsEl) return;
  const scoped = items.filter(inScope);
  tabsEl.querySelectorAll(".tab").forEach(b=>b.remove());
  CATS.forEach(c=>{
    const n = c.key==="all" ? scoped.length : scoped.filter(i=>i.kind===c.key).length;
    const active = activeCat===c.key;
    const s = tabStyle(c.key);
    const btn = h(`<button class="tab ${active?'active':''}" style="--tab-accent:${s.color}">
      <span class="tab-icon">${ICON[c.key]||ICON.other}</span>${c.label}<span class="count ${n>0?'has':''}">${n}</span>
    </button>`);
    btn.onclick = ()=>{ if(activeCat===c.key) return; activeCat=c.key; visibleCount = PAGE_SIZE; paintTabs(); paintItems(); };
    tabsEl.appendChild(btn);
  });
  positionIndicator();
}

function positionIndicator(){
  const tabsEl = document.getElementById("tabs");
  const indicator = document.getElementById("tab-indicator");
  const activeBtn = tabsEl && tabsEl.querySelector(".tab.active");
  if(!tabsEl || !indicator || !activeBtn) return;
  const tabsRect = tabsEl.getBoundingClientRect();
  const btnRect = activeBtn.getBoundingClientRect();
  const pad = 14;   // extra width each side so the dome curves smoothly instead of pinching
  const rise = 16;  // how far the dome pokes above the bar's top edge
  indicator.style.width  = (btnRect.width + pad*2) + "px";
  indicator.style.height = (btnRect.height + rise) + "px";
  const left = (btnRect.left - tabsRect.left) - pad;
  const top  = (btnRect.top  - tabsRect.top)  - rise;
  indicator.style.transform = `translate3d(${left}px, ${top}px, 0)`;
}
window.addEventListener("resize", positionIndicator);

function paintItems(){
  const wrap = document.getElementById("items");
  const empty = document.getElementById("empty");
  const resultCount = document.getElementById("result-count");
  if(!wrap) return;
  let list = items.filter(inScope);
  if(activeCat!=="all") list = list.filter(i=>i.kind===activeCat);
  list = list.filter(i=>matchesSearch(i, searchQuery));
  wrap.innerHTML="";

  // badge on the "For me" tab
  const fc = document.getElementById("forme-count");
  if(fc){
    const n = items.filter(isForMe).length;
    fc.textContent = n;
    fc.classList.toggle("hidden", n===0);
  }

  if(searchQuery){
    resultCount.classList.remove("hidden");
    resultCount.textContent = `${list.length} result${list.length===1?'':'s'} for "${searchQuery}"`;
  } else {
    resultCount.classList.add("hidden");
  }

  if(list.length===0){
    empty.classList.remove("hidden");
    empty.innerHTML = searchQuery
      ? `${ICON.search}<div><b>No matches</b><div>Try a different search term.</div></div>`
      : `${ICON.inbox}<div><b>Nothing here yet</b><div>Send a note or drop a file above to get started.</div></div>`;
  } else {
    empty.classList.add("hidden");
  }

  // Build the rows first (a folder counts as one row, not one per file),
  // then only render the first pageful so the page stays short.
  const rows = [];
  const renderedFolders = new Set();
  list.forEach(it=>{
    if(it.folder){
      if(renderedFolders.has(it.folder)) return;
      renderedFolders.add(it.folder);
      rows.push({folder:it.folder, group:list.filter(x=>x.folder===it.folder)});
    } else {
      rows.push({it});
    }
  });

  const shown = Math.min(visibleCount, rows.length);
  rows.slice(0, shown).forEach(r=>{
    wrap.appendChild(r.folder ? folderNode(r.folder, r.group) : itemNode(r.it));
  });

  if(rows.length > shown){
    const bar = h(`<div class="more-bar">
      <span class="shown">Showing ${shown} of ${rows.length}</span>
      <span class="btns"></span>
    </div>`);
    const btns = bar.querySelector(".btns");

    const more = h(`<button class="primary-more">${ICON.caret}Show ${Math.min(PAGE_SIZE, rows.length-shown)} more</button>`);
    more.onclick = ()=>{ visibleCount += PAGE_SIZE; paintItems(); };
    btns.appendChild(more);

    const all = h(`<button>Show all ${rows.length}</button>`);
    all.onclick = ()=>{ visibleCount = Infinity; paintItems(); };
    btns.appendChild(all);

    wrap.appendChild(bar);
  } else if(rows.length > PAGE_SIZE){
    // everything is on screen — offer a way back to a short list
    const bar = h(`<div class="more-bar">
      <span class="shown">Showing all ${rows.length}</span>
      <span class="btns"></span>
    </div>`);
    const less = h(`<button>Show fewer</button>`);
    less.onclick = ()=>{ visibleCount = PAGE_SIZE; paintItems(); window.scrollTo({top:0, behavior:"smooth"}); };
    bar.querySelector(".btns").appendChild(less);
    wrap.appendChild(bar);
  }

  refreshFolderSuggestions();
}

function folderNode(name, groupItems){
  const isOpen = !!searchQuery || openFolders.has(name);
  const wrap = h(`<div class="folder-group ${isOpen?'open':''}"></div>`);
  const head = h(`<button class="folder-head">
    <span class="folder-visual">
      <span class="folder-page folder-page-a"></span>
      <span class="folder-page folder-page-b"></span>
      <span class="folder-page folder-page-c"></span>
      <span class="folder-shell"></span>
    </span>
    <span class="folder-name">${esc(name)}</span>
    <span class="count">${groupItems.length}</span>
    <span class="folder-chevron">${ICON.chevron}</span>
  </button>`);
  head.onclick = ()=>{
    if(openFolders.has(name)) openFolders.delete(name); else openFolders.add(name);
    paintItems();
  };
  wrap.appendChild(head);
  if(isOpen){
    const body = h(`<div class="folder-body"></div>`);
    groupItems.forEach(it=>body.appendChild(itemNode(it)));
    wrap.appendChild(body);
  }
  return wrap;
}

function refreshFolderSuggestions(){
  const dl = document.getElementById("folder-suggestions");
  if(!dl) return;
  const names = [...new Set(items.filter(i=>i.folder).map(i=>i.folder))].sort();
  dl.innerHTML = names.map(n=>`<option value="${esc(n)}">`).join("");
}

// Recognises the usual YouTube link shapes; returns the 11-char video id.
function youtubeId(url){
  const m = (url||"").match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/);
  return m ? m[1] : null;
}

function transcriptBlock(it){
  const box = h(`<div class="transcript"></div>`);
  box.appendChild(h(`<div class="transcript-label">${ICON.audio}Transcript</div>`));
  box.appendChild(h(`<p class="transcript-text">${highlight(it.transcript||"", searchQuery)}</p>`));
  return box;
}

async function runTranscribe(it, node){
  const body = node.querySelector(".item-body");
  node.querySelectorAll(".transcribing,.transcribe-err").forEach(el=>el.remove());
  const status = h(`<div class="transcribing"><span class="spinner"></span>Transcribing…</div>`);
  body.appendChild(status);
  try{
    const text = await Backend.transcribe({storage_path: it.storage_path});
    await Backend.setTranscript(it.id, text);
    const row = items.find(x=>x.id===it.id);
    if(row) row.transcript = text;
    paintItems();
  }catch(e){
    status.remove();
    body.appendChild(h(`<p class="transcribe-err">${esc(e.message||"Transcription failed.")}</p>`));
  }
}

function itemNode(it){
  const mine = session && it.owner === session.user.id;
  const node = h(`<div class="item"></div>`);
  node.appendChild(itemIcon(it.kind));
  const body = h(`<div class="item-body"></div>`);
  node.appendChild(body);

  const head = h(`<div class="item-head"><p class="item-title">${highlight(it.title||"Untitled", searchQuery)}</p></div>`);
  if(mine) head.appendChild(h(`<span class="badge-mine">You</span>`));
  body.appendChild(head);

  if(it.kind==="text" || it.kind==="code"){
    const content = it.content||"";
    // Long notes get collapsed to a readable preview so the feed stays scannable.
    const long = content.split("\n").length > 6 || content.length > 400;
    const pre = h(`<pre class="item-text ${it.kind==='code'?'code':''} ${long?'clamped':''}">${highlight(content, searchQuery)}</pre>`);
    body.appendChild(pre);
    if(long){
      const btn = h(`<button class="expand-btn">${ICON.caret}<span>Show more</span></button>`);
      btn.onclick = ()=>{
        const clamped = pre.classList.toggle("clamped");
        btn.classList.toggle("open", !clamped);
        btn.querySelector("span").textContent = clamped ? "Show more" : "Show less";
      };
      body.appendChild(btn);
    }
  } else if(it.kind==="image"){
    const img = h(`<img class="thumb" alt="${esc(it.title)}">`);
    Backend.fileUrl(it).then(u=>{ if(u) img.src=u; });
    body.appendChild(img);
  } else if(it.demoNoContent){
    body.appendChild(h(`<p class="demo-limit">Preview/download isn't available for this sample file in Demo Mode.</p>`));
  }

  if(it.kind==="audio" && it.transcript){
    body.appendChild(transcriptBlock(it));
  }

  // Who can see this? Only shown when it isn't the default shared-with-all.
  if(it.visibility === "tagged" || it.visibility === "private"){
    const row = h(`<div class="item-share"></div>`);
    if(it.visibility === "private"){
      row.appendChild(h(`<span class="vis-badge private">${ICON.lock}Just you</span>`));
    } else {
      row.appendChild(h(`<span class="vis-badge tagged">${ICON.at}Tagged only</span>`));
      const names = (it.tagged||[]).map(id => id===myId() ? "<b>you</b>" : "<b>"+esc(handleFor(id))+"</b>");
      if(names.length) row.appendChild(h(`<span class="tag-list">→ ${names.join(", ")}</span>`));
    }
    body.appendChild(row);
  }

  const meta = h(`<p class="item-meta"></p>`);
  meta.appendChild(h(`<span class="owner">${esc(it.owner_email||"")}</span>`));
  meta.appendChild(h(`<span class="sep">·</span>`));
  const time = h(`<span title="${fullTime(it.created_at)}">${timeAgo(it.created_at)}</span>`);
  meta.appendChild(time);
  if(it.size){ meta.appendChild(h(`<span class="sep">·</span>`)); meta.appendChild(h(`<span>${humanSize(it.size)}</span>`)); }
  body.appendChild(meta);

  const actions = h(`<div class="item-actions"></div>`);
  if(it.kind==="text" || it.kind==="code"){
    const copy = h(`<button>${ICON.copy}Copy</button>`);
    copy.onclick = ()=>{ navigator.clipboard.writeText(it.content||""); copy.innerHTML = ICON.check+"Copied"; setTimeout(()=>copy.innerHTML=ICON.copy+"Copy",1200); };
    actions.appendChild(copy);
  } else if(!it.demoNoContent){
    const dl = h(`<button>${ICON.download}Download</button>`);
    dl.onclick = async ()=>{ const u=await Backend.fileUrl(it, true); if(u) window.open(u,"_blank"); };
    actions.appendChild(dl);
  }

  if(it.kind==="audio"){
    if(it.transcript){
      const ct = h(`<button>${ICON.copy}Copy transcript</button>`);
      ct.onclick = ()=>{
        navigator.clipboard.writeText(it.transcript||"");
        ct.innerHTML = ICON.check+"Copied";
        setTimeout(()=>ct.innerHTML = ICON.copy+"Copy transcript", 1200);
      };
      actions.appendChild(ct);
    } else if(!it.demoNoContent){
      const tr = h(`<button>${ICON.spark}Transcribe</button>`);
      tr.onclick = ()=>runTranscribe(it, node);
      actions.appendChild(tr);
    }
  }
  if(mine){ const del=h(`<button class="del">${ICON.trash}Remove</button>`); del.onclick=()=>removeItem(it); actions.appendChild(del); }
  body.appendChild(actions);

  return node;
}

async function removeItem(it){
  await Backend.deleteItem(it);
  await loadItems();
}

async function loadItems(){
  items = await Backend.listItems();
  paintTabs(); paintItems();
}

// Manual refresh, with a spin so it's clear something happened even when
// nothing new came back.
let refreshing = false;
async function refreshNow(btn){
  if(refreshing) return;
  refreshing = true;
  if(btn) btn.classList.add("spinning");
  const started = Date.now();
  try{
    await loadItems();
  }catch(e){
    console.warn("Refresh failed:", e.message||e);
  }finally{
    // let the spin be visible even on a fast connection
    const wait = Math.max(0, 450 - (Date.now() - started));
    setTimeout(()=>{ if(btn) btn.classList.remove("spinning"); refreshing = false; }, wait);
  }
}

// An installed app gets suspended when you switch away, and the realtime
// socket usually dies with it — so pull fresh items whenever we come back,
// and restart the live connection.
function watchForResume(){
  const resume = ()=>{
    if(document.visibilityState !== "visible" || !session) return;
    refreshNow(document.getElementById("refresh"));
    if(realtimeStarted){ stopRealtime(); startRealtime(); }
  };
  document.addEventListener("visibilitychange", resume);
  window.addEventListener("online", resume);
  window.addEventListener("focus", resume);
}

// ---------- realtime ----------
let realtimeStarted = false;
function startRealtime(){
  if(realtimeStarted) return;
  realtimeStarted = true;
  Backend.startRealtime(
    (newItem)=>{ if(!items.some(i=>i.id===newItem.id)){ items.unshift(newItem); paintTabs(); paintItems(); } },
    (oldItem)=>{ const before=items.length; items = items.filter(i=>i.id!==oldItem.id); if(items.length!==before){ paintTabs(); paintItems(); } }
  );
}
function stopRealtime(){ if(realtimeStarted){ Backend.stopRealtime(); realtimeStarted=false; } }

// Who's in the space, and which of them is me.
async function loadPeople(){
  try{
    profiles = await Backend.listProfiles();
    me = await Backend.myProfile();
  }catch(e){
    // An older project without the profiles table shouldn't break the app;
    // tagging just stays unavailable until setup.sql is re-run.
    profiles = []; me = null;
    console.warn("Profiles unavailable — re-run supabase/setup.sql to enable tagging.", e.message||e);
  }
}

// ---------- boot ----------
async function boot(){
  watchForResume();
  session = await Backend.getSession();
  if(session) await loadPeople();
  render();
  if(session){ await loadItems(); startRealtime(); }

  if(!DEMO){
    Backend.onAuthChange(async (s)=>{
      session = s;
      if(session) await loadPeople();
      render();
      if(session){ loadItems(); startRealtime(); }
      else { stopRealtime(); }
    });
  }
}
boot();

// ---------- installable app ----------
// Only over http(s) — opening index.html straight off disk has no origin
// to register against, and that's fine: the app still works.
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{ /* not fatal */ });
  });
}
</script>
